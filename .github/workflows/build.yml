name: Build and push container image

# 推送到 main 分支或打 tag 时，自动构建镜像并推送到 GitHub Container Registry。
# 镜像地址：ghcr.io/wlgh01/nai-idlecloud-proxy
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 镜像发布前先跑测试，测试不过就不发布。
      # 注意：不要用引号包住 glob（如 "test/*.test.js"），YAML 下 shell 不会展开它，
      # Node 20 的 --test 也不接受 glob 模式。无参数时 Node 会自动发现 test 目录。
      - name: Run tests
        run: node --test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 构建后先本地起容器验证一遍：单元测试只看源码，发现不了
      # 「Dockerfile 漏 COPY 某模块」这类只在运行时暴露的问题。
      - name: Build image for smoke test
        run: docker build -t nai-idlecloud-proxy:smoke .

      - name: Image smoke test
        run: SMOKE_IMAGE=nai-idlecloud-proxy:smoke SMOKE_PORT=18788 node scripts/docker-smoke.mjs

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
